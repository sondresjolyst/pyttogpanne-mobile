version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  groups:
    github-actions:
      patterns:
      - '*'
  schedule:
    interval: weekly
    day: sunday
    time: '03:00'
    timezone: Europe/Oslo
  cooldown:
    default-days: 7
  commit-message:
    prefix: ci(github-actions)
- package-ecosystem: npm
  directory: /
  groups:
    react:
      patterns:
      - react
      - react-dom
      - '@types/react'
      - '@types/react-dom'
    next:
      patterns:
      - next
      - next-auth
      - eslint-config-next
    expo:
      patterns:
      - expo
      - expo-*
      - '@expo/*'
    react-native:
      patterns:
      - react-native
      - react-native-*
      - '@react-native/*'
      - '@react-navigation/*'
    eslint:
      patterns:
      - '@eslint/*'
      - eslint
      - eslint-config-*
      - eslint-plugin-*
      - typescript-eslint
    testing:
      patterns:
      - vitest
      - '@vitejs/*'
      - '@testing-library/*'
      - jsdom
      - jest
      - jest-*
      - babel-jest
    tailwind:
      patterns:
      - tailwindcss
      - '@tailwindcss/*'
      - postcss
    types:
      patterns:
      - '@types/*'
  schedule:
    interval: weekly
    day: sunday
    time: '03:00'
    timezone: Europe/Oslo
  cooldown:
    default-days: 7
  commit-message:
    prefix: deps(npm)
  ignore:
  - dependency-name: react
    update-types: [version-update:semver-major, version-update:semver-minor]
  - dependency-name: react-dom
    update-types: [version-update:semver-major, version-update:semver-minor]
  - dependency-name: '@types/react'
    update-types: [version-update:semver-major, version-update:semver-minor]
  - dependency-name: react-native
    update-types: [version-update:semver-major, version-update:semver-minor]
  - dependency-name: react-native-*
    update-types: [version-update:semver-major, version-update:semver-minor]
  - dependency-name: expo
    update-types: [version-update:semver-major]
  - dependency-name: expo-*
    update-types: [version-update:semver-major]
  - dependency-name: jest
    update-types: [version-update:semver-major]
  - dependency-name: '@types/jest'
    update-types: [version-update:semver-major]
  - dependency-name: typescript
    update-types: [version-update:semver-major]
  - dependency-name: eslint
    update-types: [version-update:semver-major]
