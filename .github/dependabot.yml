version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  groups:
    github-actions:
      patterns:
      - '*'
  schedule:
    interval: weekly
    day: sunday
    time: '03:00'
    timezone: Europe/Oslo
  cooldown:
    default-days: 7
  commit-message:
    prefix: ci(github-actions)
- package-ecosystem: npm
  directory: /
  groups:
    expo:
      patterns:
      - expo
      - expo-*
      - '@expo/*'
    react-native:
      patterns:
      - react
      - react-dom
      - react-native
      - react-native-*
      - '@react-native/*'
      - '@react-navigation/*'
    eslint:
      patterns:
      - eslint
      - eslint-config-*
    testing:
      patterns:
      - jest
      - jest-*
      - '@testing-library/*'
      - babel-jest
    types:
      patterns:
      - '@types/*'
  schedule:
    interval: weekly
    day: sunday
    time: '03:00'
    timezone: Europe/Oslo
  cooldown:
    default-days: 7
  commit-message:
    prefix: deps(npm)
