name: 📦 Android release

on:
  workflow_call:
    inputs:
      track:
        description: Play track to upload to
        type: string
        required: false
        default: alpha
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to
        type: choice
        required: false
        default: alpha
        options:
          - internal
          - alpha
          - beta

permissions: {}

jobs:
  build:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play-testing
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_API_URL: https://pyttogpanne-api.prod.tumogroup.com/api
    steps:
      - name: Reject a direct production upload
        env:
          TRACK: ${{ inputs.track }}
        run: |
          if [ "$TRACK" = "production" ]; then
            echo "::error::This workflow cannot upload to production. Use promote-production.yml, which is gated by the google-play-production environment."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '23'
          cache: 'npm'

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install fastlane
        run: bundle install --jobs 4 --retry 3

      - name: Install dependencies
        run: npm ci

      - name: Derive the version code
        id: version
        run: |
          code="$(node scripts/android-version-code.js)"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Write the version code into app.json
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          tmp="$(mktemp)"
          jq --argjson code "$VERSION_CODE" '.expo.android.versionCode = $code' app.json > "$tmp"
          mv "$tmp" app.json

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install

      - name: Confirm the version code reached the native project
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          if ! grep -q "versionCode $VERSION_CODE" android/app/build.gradle; then
            echo "::error::app.json carried versionCode $VERSION_CODE but prebuild did not write it into android/app/build.gradle. Building now would produce a bundle Play rejects as a duplicate."
            exit 1
          fi

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks

      - name: Build the app bundle
        working-directory: android
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/android/app/upload.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --init-script ../gradle/android-signing.init.gradle | tee gradle.log
          if ! grep -q 'android-signing: release signingConfig set to uploadKey' gradle.log; then
            echo "::error::The signing init script did not apply. The bundle would be debug signed or unsigned."
            exit 1
          fi

      - name: Confirm the bundle is signed
        run: |
          out=android/app/build/outputs/bundle/release
          if [ ! -f "$out/app-release.aab" ]; then
            echo "::error::No signed bundle at $out/app-release.aab"
            ls -la "$out" || true
            exit 1
          fi
          if [ -f "$out/app-release-unsigned.aab" ]; then
            echo "::error::Gradle produced an unsigned bundle. Signing did not apply."
            exit 1
          fi

      - name: Upload to Play
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
        run: |
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$PLAY_JSON" > "$key"
          bundle exec fastlane android upload track:"$TRACK" json_key:"$key"
